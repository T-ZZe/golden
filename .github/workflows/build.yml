name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compiler
        run: |
          POM=$(find . -name pom.xml -not -path './.git/*' | head -n1)
          echo "pom.xml trouvé : $POM"
          mvn -B -f "$POM" package

      - uses: actions/upload-artifact@v4
        with:
          name: Cooldown
          path: '**/target/Cooldown.jar'
